<!DOCTYPE html>
<html lang="es">
<head>
  <script type="text/javascript">
  window._mfq = window._mfq || [];
  (function() {
    var mf = document.createElement("script");
    mf.type = "text/javascript"; mf.defer = true;
    mf.src = "//cdn.mouseflow.com/projects/c146298f-e76d-4274-8cca-6ef5e78554a1.js";
    document.getElementsByTagName("head")[0].appendChild(mf);
  })();

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrito — Kobo</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <nav class="nav">
    <a href="index.html" class="brand">
      <svg class="mark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 10c0 6 4 9 8 9s8-3 8-9" stroke="#2F4538" stroke-width="2" stroke-linecap="round"/><ellipse cx="12" cy="10" rx="8" ry="2.4" stroke="#2F4538" stroke-width="2"/></svg>
      Kobo
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Inicio</a></li>
      <li><a href="shop.html">Tienda</a></li>
      <li><a href="about.html">Estudio</a></li>
      <li><a href="faq.html">Preguntas</a></li>
      <li><a href="contact.html">Contacto</a></li>
    </ul>
    <div class="nav-actions">
      <a class="cart-btn" href="cart.html">
        Carrito <span class="cart-count" data-cart-count>0</span>
      </a>
      <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>
</header>

<main>
  <div class="wrap page-head">
    <span class="eyebrow">Paso 1 de 3</span>
    <h1 style="font-size:clamp(2rem,4vw,3rem);">Tu carrito</h1>
  </div>

  <section class="section" style="padding-top:20px;">
    <div class="wrap" id="cart-root" style="display:grid;grid-template-columns:1.6fr 1fr;gap:48px;align-items:flex-start;">
      <!-- se rellena por JS -->
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <hr class="hairline" style="margin-bottom:24px;">
    <div class="footer-bottom">
      <span>© 2026 Kobo Estudio — sitio de demostración</span>
      <a href="shop.html" style="text-decoration:none;">Seguir comprando</a>
    </div>
  </div>
</footer>

<style>
  @media (max-width:860px){ #cart-root{ grid-template-columns:1fr !important; } }
</style>

<script src="assets/main.js"></script>
<script>
  function renderCart(){
    const root = document.getElementById("cart-root");
    const lines = cartLinesWithData();

    if(lines.length === 0){
      root.style.gridTemplateColumns = "1fr";
      root.innerHTML = `
        <div class="empty-state">
          <svg class="glyph" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 46 C14 66 34 78 50 78 C66 78 86 66 86 46" fill="none" stroke="#8A7B62" stroke-width="3"/>
            <ellipse cx="50" cy="46" rx="36" ry="8" fill="none" stroke="#8A7B62" stroke-width="3"/>
          </svg>
          <h3>Tu carrito está vacío</h3>
          <p>Aún no has añadido ninguna pieza.</p>
          <a href="shop.html" class="btn btn-primary">Ir a la tienda</a>
        </div>`;
      return;
    }

    const subtotal = cartSubtotal();
    const shipping = subtotal > 60 ? 0 : 6;
    const total = subtotal + shipping;

    root.style.gridTemplateColumns = "1.6fr 1fr";
    root.innerHTML = `
      <div>
        <table class="cart-table">
          <thead>
            <tr><th>Pieza</th><th>Cantidad</th><th>Precio</th><th></th></tr>
          </thead>
          <tbody id="cart-rows">
            ${lines.map(l => `
              <tr data-line="${l.id}">
                <td>
                  <div class="cart-line">
                    <div class="cart-thumb">${potteryShape(l.product.shape, l.product.tone)}</div>
                    <div>
                      <div style="font-weight:500;">${l.product.name}</div>
                      <div class="card-cat">${l.product.cat}</div>
                    </div>
                  </div>
                </td>
                <td>
                  <div class="qty-stepper" data-line-qty="${l.id}">
                    <button type="button" data-qty="dec">−</button>
                    <span>${l.qty}</span>
                    <button type="button" data-qty="inc">+</button>
                  </div>
                </td>
                <td class="mono">€${l.product.price * l.qty}</td>
                <td><button class="remove-link" data-remove="${l.id}">Quitar</button></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
      <div class="summary-card">
        <h3 style="margin-bottom:18px;">Resumen</h3>
        <div class="promo-row">
          <input type="text" placeholder="Código de descuento" id="promo-input">
          <button class="btn btn-ghost btn-sm" id="promo-btn">Aplicar</button>
        </div>
        <div class="summary-row"><span>Subtotal</span><span class="mono">€${subtotal}</span></div>
        <div class="summary-row"><span>Envío</span><span class="mono">${shipping === 0 ? "Gratis" : "€" + shipping}</span></div>
        <div class="summary-row total"><span>Total</span><span class="mono">€${total}</span></div>
        <a href="checkout.html" class="btn btn-primary btn-block" style="margin-top:20px;">Ir a pagar</a>
        <a href="shop.html" class="btn btn-ghost btn-block" style="margin-top:10px;">Seguir comprando</a>
      </div>
    `;

    document.querySelectorAll("[data-line-qty]").forEach(stepper => {
      const id = stepper.getAttribute("data-line-qty");
      stepper.addEventListener("click", (e) => {
        const action = e.target.getAttribute("data-qty");
        if(!action) return;
        const line = getCart().find(l => l.id === id);
        const current = line ? line.qty : 1;
        setQty(id, action === "inc" ? current + 1 : current - 1);
        renderCart();
      });
    });
    document.querySelectorAll("[data-remove]").forEach(btn => {
      btn.addEventListener("click", () => {
        removeFromCart(btn.getAttribute("data-remove"));
        renderCart();
      });
    });
    document.getElementById("promo-btn").addEventListener("click", () => {
      showToast("Código no válido (demostración)");
    });
  }

  renderCart();
</script>
</body>
</html>
